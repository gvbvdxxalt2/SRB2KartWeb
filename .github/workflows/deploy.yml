name: Deploy SRB2Kart Web

on:
  push:
    branches: ["master"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Install Game Assets
        run: ./get-assets.sh

      - name: Build Project
        run: yarn build

      - name: Track Large Assets for Deployment
        run: |
          cd launcher-dist
          git init
          git lfs install
          git lfs track "*.kart"
          git lfs track "*.srb"
          git lfs track "*.wad"
          git add .gitattributes
          git add .
        shell: bash

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'launcher-dist' # Path to your built output folder

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4